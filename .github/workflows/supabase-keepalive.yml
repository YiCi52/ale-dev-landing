name: Supabase keepalive

# Supabase pausa los proyectos del plan gratuito tras 7 DÍAS SIN ACTIVIDAD.
# Un proyecto pausado deja de aceptar escrituras: el formulario de leads falla
# y ese lead se pierde sin que nadie se entere.
#
# OJO — lo que NO evita la pausa:
#   · los backups automáticos de Supabase (los hace la plataforma, no cuentan como actividad)
#   · el CI (solo corre en push)
#   · los escenarios de Make disparados por webhook (solo corren si YA llegó un lead)
#   · las peticiones RECHAZADAS (401). Hasta el 16-sep-2026 esto pedía la raíz
#     `/rest/v1/`, que con la llave publicable responde 401: falló en cada corrida
#     desde el 28-ago y aceptaba 404 como éxito.
#
# Ahora lee la fila única de `public.latido`, que anon sí puede leer. Solo un 200
# con la fila cuenta como éxito.
#
# Corre cada 3 días, la mitad del umbral, para aguantar un fallo suelto. Es respaldo
# del cron diario de Vercel (/api/keepalive), que lee la misma tabla.

on:
  schedule:
    - cron: "17 8 */3 * *" # cada 3 días, 08:17 UTC (3:17am Colombia)
  workflow_dispatch: {} # para poder dispararlo a mano y comprobar que sirve

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leer el latido de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL y/o SUPABASE_ANON_KEY en el repo."
            exit 1
          fi

          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" --max-time 30 \
            "${SUPABASE_URL}/rest/v1/latido?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}")

          echo "HTTP $code"

          if [ "$code" = "200" ] && grep -q '"id"' /tmp/out.txt; then
            echo "✅ Latido leído: el proyecto está activo y la petición cuenta"
            exit 0
          fi

          # 401 = llave vieja o sin permiso · 503/540 = pausado o arrancando.
          # Falla ruidosamente: el correo de GitHub Actions ES la alerta.
          echo "::error::Supabase respondió $code sin el latido — revisar la llave del secret o si el proyecto está PAUSADO."
          head -c 400 /tmp/out.txt
          exit 1
