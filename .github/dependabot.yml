# Actualizaciones automáticas (CN-004, 23-oct): antes tenía package-ecosystem vacío y nunca abrió un PR.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
